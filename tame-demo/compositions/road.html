    const tl = gsap.timeline({ paused: true });

      { x: -amp * 0.5, y: amp * 0.2, duration: 0.05 }, { x: amp * 0.25, y: 0, duration: 0.05 }, { x: 0, y: 0, duration: 0.07 }

      const r = rng(seed);

        if (r() > .7) mk("rect", { x: x + cw * .4, y: 690 - h - 26, width: 3, height: 26 }, b);
        for (let wy = 690 - h + 10; wy < 684; wy += 12) for (let wx = x + 5; wx < x + cw - 6; wx += 9) if (r() > .72) mk("rect", { x: wx, y: wy, width: 4, height: 5, opacity: .3 + r() * .6 }, w);

      for (let i = -14; i <= 14; i++) mk("line", { x1: 540 + i * 18, y1: 692, x2: 540 + i * 190, y2: 1960 }, fu);
      // perspective centre dashes and utility poles (procedural)
      const dg = $("#rd-dashes"), pg = $("#rd-poles");
      const Y = (s) => 690 + 1270 * s;
      for (let k = 0; k < 9; k++) { const s0 = Math.pow(k / 8, 2.2), s1 = Math.pow((k + .45) / 8, 2.2);

        const w0 = 2 + 14 * s0, w1 = 2 + 14 * s1;
        mk("polygon", { points: `${540 - w0},${Y(s0)} ${540 + w0},${Y(s0)} ${540 + w1},${Y(s1)} ${540 - w1},${Y(s1)}` }, dg); }
      [.035, .07, .12, .19, .29, .44, .66].forEach((s) => { const y = Y(s), h = 12 + 900 * s, ww = 1.5 + 14 * s;
        for (const side of [-1, 1]) { const xx = 540 + side * (30 + 760 * s);
          mk("rect", { x: xx - ww / 2, y: y - h, width: ww, height: h }, pg);
          mk("rect", { x: xx - ww * 4, y: y - h + ww * 2, width: ww * 8, height: Math.max(ww * .8, 1.5) }, pg);
          mk("rect", { x: xx - ww * 3, y: y - h + ww * 5, width: ww * 6, height: Math.max(ww * .6, 1.2) }, pg); } });
    })();
    sceneIO("#rd-wrap", 4);
    tl.fromTo("#rd-world", { scale: 1.0 }, { scale: 1.05, duration: 2.3, ease: "sine.inOut" }, 0);
    tl.to("#rd-world", { scale: 1.0, duration: 0.3, ease: "power4.out" }, 2.35);
    tl.fromTo("#rd-city", { scale: 1, svgOrigin: "540 690" }, { scale: 1.05, duration: 2.2, ease: "sine.inOut" }, 0.2);
    tl.fromTo("#rd-glow", { opacity: 0.7 }, { opacity: 1, duration: 2, ease: "sine.inOut" }, 0.2);
    rise("#d1 .wd", 0.15, { y: 40, b: 12, s: 0.12 });
    rise("#d2 .wd", 0.5, { y: 30, b: 10, s: 0.09, d: 0.7 });
    tl.fromTo("#rd-sign", { opacity: 0, scaleY: 0.2, y: -20 }, { opacity: 1, scaleY: 1, y: 0, duration: 0.6, ease: "back.out(2.2)" }, 0.25);
    tl.fromTo("#rd-sign", { rotation: 0 }, { keyframes: [{ rotation: 2.2, duration: .5, ease: "sine.inOut" }, { rotation: -1.2, duration: .6, ease: "sine.inOut" }, { rotation: 0, duration: .6, ease: "sine.inOut" }], transformOrigin: "50% 0%", immediateRender: false }, 0.85);
    // walk toward the city with a gait bob, then the rope yanks back
    tl.to("#walker", { x: 70, y: -180, scale: 0.65, svgOrigin: "540 1000", duration: 1.5, ease: "power1.inOut" }, 0.7);

    tl.to("#rd-trail", { opacity: 0, duration: 0.5 }, 2.2);

    tl.to("#road-rope", { strokeWidth: 10, duration: 0.08, yoyo: true, repeat: 1 }, 2.2);

    tl.to("#road-rope", { attr: { d: "M-40 1180 Q230 1150 472 1268" }, duration: 0.22, ease: "power4.in" }, 2.35);
