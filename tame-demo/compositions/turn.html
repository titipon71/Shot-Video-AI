  <script>
    const tl = gsap.timeline({ paused: true });
    const SVGNS = "http://www.w3.org/2000/svg";
    // deterministic PRNG so every render is identical
    const rng = (s) => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const mk = (tag, attrs, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => Array.from(document.querySelectorAll(s));
    // word-level reveal (whole Thai words, so vowels / tone marks never get separated)
    const rise = (targets, at, o = {}) => tl.fromTo(targets,
      { opacity: 0, y: o.y ?? 44, scale: o.sc ?? 1, filter: "blur(" + (o.b ?? 12) + "px)" },
      { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: o.d ?? 0.75, ease: o.e ?? "expo.out", stagger: o.s ?? 0.1 }, at);
    const wipeMark = (mark, at) => {
      tl.fromTo(mark.querySelector(".mbg"), { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "expo.inOut" }, at);
      rise(mark.querySelectorAll(".wd"), at + 0.2, { y: 26, b: 8, d: 0.6, s: 0.08 });
    };
    const stamp = (mark, at, shakeEl) => {
      tl.fromTo(mark, { opacity: 0, scale: 1.7, filter: "blur(16px)" },
                      { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.in" }, at);
      tl.fromTo(mark, { scale: 1 }, { scale: 1.035, duration: 0.09, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at + 0.2);
      if (shakeEl) shake(shakeEl, at + 0.2, 16);
    };
    const shake = (el, at, amp = 12) => tl.to(el, { keyframes: [
      { x: -amp, y: amp * 0.4, duration: 0.04 }, { x: amp * 0.85, y: -amp * 0.35, duration: 0.04 },
      { x: -amp * 0.5, y: amp * 0.2, duration: 0.05 }, { x: amp * 0.25, y: 0, duration: 0.05 }, { x: 0, y: 0, duration: 0.07 }
    ], ease: "none" }, at);
    // soft scene in/out: no hard cuts between scenes
    const sceneIO = (wrap, dur, o = {}) => {
      if (o.in !== false) tl.fromTo(wrap, { opacity: 0, scale: 1.06, filter: "blur(14px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: o.inDur ?? 0.5, ease: "power3.out" }, 0);
      if (o.out !== false) tl.to(wrap, { opacity: 0, scale: 1.04, filter: "blur(10px)", duration: o.outDur ?? 0.34, ease: "power2.in" }, dur - (o.outDur ?? 0.34));
    };
    // floating particles (dust motes / embers)
    const particles = (g, n, seed, box, o = {}) => {
      const r = rng(seed);
      for (let i = 0; i < n; i++) {
        const x = box[0] + r() * box[2], y = box[1] + r() * box[3];
        const c = mk("circle", { cx: x, cy: y, r: (o.rmin ?? 1.5) + r() * ((o.rmax ?? 4) - (o.rmin ?? 1.5)), fill: o.fill ?? "#f4c9a8", opacity: 0 }, g);
        const a = (o.amin ?? 0.15) + r() * ((o.amax ?? 0.6) - (o.amin ?? 0.15));
        const d = o.dur;
        tl.fromTo(c, { opacity: 0, x: 0, y: 0 }, { keyframes: [
            { opacity: a, duration: d * 0.25 }, { opacity: a * (0.4 + r() * 0.6), duration: d * 0.5 }, { opacity: 0, duration: d * 0.25 } ],
          ease: "none" }, 0);
        tl.fromTo(c, { x: 0, y: 0 }, { x: (r() - 0.5) * (o.dx ?? 60), y: -((o.dymin ?? 30) + r() * ((o.dymax ?? 120) - (o.dymin ?? 30))), duration: d, ease: "sine.inOut", immediateRender: false }, 0);
      }
    };

    (() => { const r = rng(202);
      // light rays behind the shrine
      const rays = $("#tn-rays");
      for (let i = 0; i < 12; i++) { const a = -Math.PI / 2 + (i - 5.5) * 0.2, w = 0.035;
        const L = 1100, x1 = 560 + Math.cos(a - w) * L, y1 = 520 + Math.sin(a - w) * L, x2 = 560 + Math.cos(a + w) * L, y2 = 520 + Math.sin(a + w) * L;
        mk("polygon", { points: `560,520 ${x1},${y1} ${x2},${y2}`, fill: "#ff5a4a", opacity: .25 + r() * .2 }, rays); }
      rays.setAttribute("filter", "url(#tn-blur)");
      // ground cracks radiating from Khwan's feet
      const cg = $("#tn-cracks");
      for (let i = 0; i < 9; i++) { const a = Math.PI * (0.02 + 0.96 * i / 8); let x = 540, y = 1262, d = `M${x} ${y}`;
        for (let s = 0; s < 5; s++) { x += Math.cos(a) * (40 + r() * 50) * (s < 1 ? .6 : 1) + (r() - .5) * 30; y += Math.sin(a) * (14 + r() * 18) + 6; d += ` L${x.toFixed(1)} ${y.toFixed(1)}`; }
        const p = mk("path", { d, "stroke-width": 3 + r() * 2, opacity: 0, "stroke-dasharray": 400, "stroke-dashoffset": 400 }, cg);
        tl.fromTo(p, { strokeDashoffset: 400, opacity: 0 }, { strokeDashoffset: 0, opacity: .85, duration: 0.5, ease: "expo.out" }, 2.42 + r() * .08); }
      // smoke puffs where the villagers transform
      const sg = $("#tn-smoke");
      [[160, 1250], [900, 1230]].forEach(([cx, cy]) => { for (let i = 0; i < 7; i++) {
        const c = mk("circle", { cx: cx + (r() - .5) * 120, cy: cy - r() * 200, r: 50 + r() * 40, opacity: 0 }, sg);
        tl.fromTo(c, { opacity: 0, scale: .4, svgOrigin: `${cx} ${cy}` }, { keyframes: [{ opacity: .9, scale: 1.1, duration: .25, ease: "power2.out" }, { opacity: 0, scale: 1.6, duration: .9, ease: "power1.in" }] }, 2.3 + i * .02); } });
    })();
    particles($("#tn-embers"), 40, 77, [80, 700, 920, 700], { dur: 5, rmin: 1.5, rmax: 3.5, amin: .35, amax: .9, dx: 100, dymin: 200, dymax: 520, fill: "#ff8a5a" });
    sceneIO("#tn-wrap", 5);
    tl.fromTo("#tn-world", { scale: 1.0 }, { scale: 1.08, duration: 5, ease: "sine.inOut" }, 0);
    tl.fromTo("#turn-shrine", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.05);
    tl.fromTo("#tn-khwan-anim", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
    rise("#u1 .wd", 0.35, { y: 40, b: 12, s: 0.11 });
    stamp("#tn-mark", 0.85, "#tn-txt");
    tl.fromTo("#turn-draw-a", { strokeDashoffset: 520 }, { strokeDashoffset: 0, duration: 0.7, ease: "expo.inOut" }, 1.35);
    tl.fromTo("#turn-draw-b", { strokeDashoffset: 520 }, { strokeDashoffset: 0, duration: 0.7, ease: "expo.inOut" }, 1.5);
    // heartbeat pulse building to the transformation
    tl.fromTo("#tn-pulse", { opacity: 0.4, scale: 1, svgOrigin: "540 640" }, { opacity: 0.8, scale: 1.06, duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.8);
    // acting: Khwan blinks, then her face hardens on the stamp; villagers flinch
    const blink = (sel, at) => tl.fromTo(sel, { scaleY: 1 }, { scaleY: 0.12, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false }, at);
    blink("#tnk-eyes", 0.5); blink("#tv1-eyes", 0.9); blink("#tv2-eyes", 1.2); blink("#tnk-eyes", 3.7);
    tl.set(".tnk-exp", { opacity: 0 }, 0.9); tl.set("#tnk-exp-fierce", { opacity: 1 }, 0.9);
    // halter ropes follow the villagers' necks down as they squash into bulls
    tl.to(["#turn-draw-a", "#turn-rope", "#turn-braid-a"], { attr: { d: "M437 1008 C340 1100 210 1170 122 1178" }, duration: 0.35, ease: "power3.in" }, 2.1);
    tl.to(["#turn-draw-b", "#turn-rope-b", "#turn-braid-b"], { attr: { d: "M633 1008 C730 1100 840 1180 920 1192" }, duration: 0.35, ease: "power3.in" }, 2.1);
    tl.to(["#turn-p1", "#turn-p2"], { scaleY: 0.55, scaleX: 1.15, transformOrigin: "50% 100%", duration: 0.35, ease: "power3.in" }, 2.1);
    tl.to("#turn-people", { opacity: 0, duration: 0.2, ease: "none" }, 2.4);
    tl.fromTo("#tn-flash", { opacity: 0 }, { keyframes: [{ opacity: .55, duration: .05 }, { opacity: 0, duration: .5, ease: "power2.out" }], immediateRender: false }, 2.42);
    tl.fromTo("#tn-shock", { opacity: 1, scale: 1, svgOrigin: "540 1262" }, { opacity: 0, scale: 14, duration: 0.9, ease: "expo.out", immediateRender: false }, 2.42);
    shake("#tn-world", 2.42, 18);
    shake("#tn-txt", 2.42, 10);
    tl.fromTo("#turn-bulls", { opacity: 0, y: 40, scaleY: 0.8, transformOrigin: "50% 100%" }, { opacity: 1, y: 0, scaleY: 1, duration: 0.5, ease: "back.out(2)" }, 2.5);
    tl.fromTo("#turn-bulls .eyeglow", { opacity: 0.2, scale: 1, transformOrigin: "50% 50%" }, { opacity: 0.7, scale: 1.6, duration: 0.25, yoyo: true, repeat: 5, ease: "sine.inOut" }, 2.6);
    tl.to("#tn-rays", { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.42);
    tl.fromTo("#tn-rays", { rotation: 0, svgOrigin: "560 520" }, { rotation: 8, duration: 2.6, ease: "none" }, 2.42);
    tl.to("#tn-shrine-halo", { opacity: 0.7, scale: 1.4, svgOrigin: "560 490", duration: 0.5, ease: "power2.out" }, 2.42);
    tl.to(["#turn-draw-a", "#turn-rope", "#turn-braid-a"], { attr: { d: "M437 1008 C360 1050 250 1100 170 1120" }, duration: 0.4, ease: "power2.in" }, 3.0);
    tl.to(["#turn-draw-b", "#turn-rope-b", "#turn-braid-b"], { attr: { d: "M633 1008 C730 1060 880 1110 980 1140" }, duration: 0.4, ease: "power2.in" }, 3.0);
    tl.fromTo(["#turn-rope", "#turn-rope-b"], { strokeWidth: 9 }, { strokeWidth: 12, duration: 0.1, yoyo: true, repeat: 1, immediateRender: false }, 3.4);
    tl.to("#turn-shrine", { filter: "drop-shadow(0 0 40px #c8282f)", duration: 0.4 }, 2.5);
    tl.fromTo("#tn-pulse", { opacity: 0.8 }, { opacity: 1, scale: 1.12, svgOrigin: "540 640", duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, 3.3);
    tl.fromTo("#tn-txt", { y: 0 }, { y: -10, duration: 5, ease: "sine.inOut" }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["turn"] = tl;
  </script>
