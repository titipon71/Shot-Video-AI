  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Slow cinematic camera push-in
    tl.fromTo(
      "#drama-stage",
      { scale: 1.0, y: 10 },
      { scale: 1.05, y: -20, duration: 4.0, ease: "sine.inOut" },
      0
    );

    // Dog tail wags happily
    tl.fromTo(
      "#dog-tail",
      { rotation: -18, transformOrigin: "-35px -15px" },
      { rotation: 22, duration: 0.25, yoyo: true, repeat: 15, ease: "sine.inOut" },
      0
    );

    // Speech bubble pops up with bouncy spring scale at t=0.6s
    tl.fromTo(
      "#speech-bubble",
      { scale: 0.3, opacity: 0, transformOrigin: "-210px 120px" },
      { scale: 1.0, opacity: 1, duration: 0.5, ease: "back.out(1.8)" },
      0.6
    );

    // Daughter breathes & tilts head worriedly
    tl.fromTo(
      "#daught-head",
      { rotation: -2, transformOrigin: "0px 80px" },
      { rotation: 3.5, duration: 1.6, yoyo: true, repeat: 1, ease: "sine.inOut" },
      0.4
    );

    // Big red "อย่า" pops out aggressively at t=2.5s
    tl.fromTo(
      "#kinetic-alert",
      { scale: 0, opacity: 0, transformOrigin: "0px 0px" },
      { scale: 1.15, opacity: 1, duration: 0.35, ease: "back.out(2.2)" },
      2.5
    );
    tl.to("#kinetic-alert", { scale: 1.0, duration: 0.2 }, 2.85);

    window.__timelines["scene-drama"] = tl;
  </script>
