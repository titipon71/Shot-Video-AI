  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Slow camera zoom-in toward the phone screen
    tl.fromTo(
      "#pov-stage",
      { scale: 1.0, y: 15 },
      { scale: 1.08, y: -25, duration: 4.0, ease: "sine.inOut" },
      0
    );

    // Hand gently sways while holding phone
    tl.fromTo(
      "#hand-and-phone-group",
      { rotation: -1.2, transformOrigin: "0px 600px" },
      { rotation: 1.5, duration: 2.0, yoyo: true, repeat: 1, ease: "sine.inOut" },
      0
    );

    // Bank slip slides up with spring into view at t=0.5s
    tl.fromTo(
      "#bank-slip-card",
      { y: 80, opacity: 0, scale: 0.9 },
      { y: 0, opacity: 1, scale: 1.0, duration: 0.65, ease: "back.out(1.5)" },
      0.5
    );

    // Money Counter ticker animation: 0 -> 30,000 -> 50,000
    const amtEl = document.getElementById("slip-amount");
    const countObj = { val: 0 };
    tl.to(
      countObj,
      {
        val: 50000,
        duration: 1.0,
        ease: "power2.out",
        onUpdate: () => {
          if (amtEl) amtEl.textContent = Math.round(countObj.val).toLocaleString("en-US");
        }
      },
      1.1
    );

    // Chat bubble pops up at t=2.1s
    tl.fromTo(
      "#sent-chat-bubble",
      { scale: 0.5, opacity: 0, transformOrigin: "150px 0px" },
      { scale: 1.0, opacity: 1, duration: 0.45, ease: "back.out(1.8)" },
      2.1
    );

    // Dramatic Twist Text "นึกว่ารอด..." slams down at t=3.0s
    tl.fromTo(
      "#twist-text-group",
      { scale: 2.2, opacity: 0, y: 40 },
      { scale: 1.0, opacity: 1, y: 0, duration: 0.4, ease: "power4.out" },
      3.0
    );

    window.__timelines["scene-phone-pov"] = tl;
