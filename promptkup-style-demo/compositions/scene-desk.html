    const tl = gsap.timeline({ paused: true });

      "#desk-stage",
      { scale: 1.06, y: -18 },
      { scale: 1.0, y: 10, duration: 4.0, ease: "sine.inOut" },
      0
    );

    // Coins dropping into the left jar and bouncing on the surface

    tl.set("#fall-coin-1, #fall-coin-2", { y: 0, opacity: 0 }, 0);

    tl.set("#fall-coin-1", { opacity: 1 }, 0.35);
    tl.to("#fall-coin-1", { y: 275, duration: 0.65, ease: "bounce.out" }, 0.35);
    tl.to("#fall-coin-1", { opacity: 0, duration: 0.25 }, 1.15);

    tl.set("#fall-coin-2", { opacity: 1 }, 1.65);
    tl.to("#fall-coin-2", { y: 395, duration: 0.75, ease: "bounce.out" }, 1.65);
    tl.to("#fall-coin-2", { opacity: 0, duration: 0.25 }, 2.55);

    // Floating coin under lamp glinting & drifting (pivot = coin's own centre)
    tl.fromTo(
      "#floating-coin",
      { y: -15, rotation: -22, transformOrigin: "50% 50%" },
      { y: 18, rotation: -12, duration: 1.3, yoyo: true, repeat: 2, ease: "sine.inOut" },
      0
    );

    // Worker at desk nodding head tiredly & typing/moving arm
    tl.fromTo(
      "#worker-head",
      { rotation: 10, transformOrigin: "0px 42px" },
      { rotation: 18, duration: 1.5, yoyo: true, repeat: 2, ease: "sine.inOut" },
      0
    );
    tl.fromTo(
      "#worker-arm",
      { rotation: -2, transformOrigin: "0px 0px" },
      { rotation: 3, duration: 0.45, yoyo: true, repeat: 7, ease: "sine.inOut" },
      0
    );

    // Mug steam rising
    tl.fromTo(
      "#mug-steam-1, #mug-steam-2",
      { y: 10, opacity: 0.15 },
      { y: -22, opacity: 0.48, duration: 1.3, yoyo: true, repeat: 2, ease: "sine.inOut" },
      0
    );

    // Wall clock spinning
    tl.fromTo(
      "#desk-clock-min",
      { rotation: 0, transformOrigin: "0px 0px" },
      { rotation: 720, duration: 4.0, ease: "none" },
      0
    );
