    const tl = gsap.timeline({ paused: true });
    const SVGNS = "http://www.w3.org/2000/svg";
    // deterministic PRNG so every render is identical
    const rng = (s) => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const mk = (tag, attrs, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => Array.from(document.querySelectorAll(s));
    // word-level reveal (whole Thai words, so vowels / tone marks never get separated)
    const rise = (targets, at, o = {}) => tl.fromTo(targets,
      { opacity: 0, y: o.y ?? 44, scale: o.sc ?? 1, filter: "blur(" + (o.b ?? 12) + "px)" },

      rise(mark.querySelectorAll(".wd"), at + 0.2, { y: 26, b: 8, d: 0.6, s: 0.08 });
    };
    const stamp = (mark, at, shakeEl) => {
      tl.fromTo(mark, { opacity: 0, scale: 1.7, filter: "blur(16px)" },
                      { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.in" }, at);
      tl.fromTo(mark, { scale: 1 }, { scale: 1.035, duration: 0.09, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at + 0.2);
      if (shakeEl) shake(shakeEl, at + 0.2, 16);
    };
    const shake = (el, at, amp = 12) => tl.to(el, { keyframes: [
      { x: -amp, y: amp * 0.4, duration: 0.04 }, { x: amp * 0.85, y: -amp * 0.35, duration: 0.04 },
      { x: -amp * 0.5, y: amp * 0.2, duration: 0.05 }, { x: amp * 0.25, y: 0, duration: 0.05 }, { x: 0, y: 0, duration: 0.07 }
    ], ease: "none" }, at);
    // soft scene in/out: no hard cuts between scenes
    const sceneIO = (wrap, dur, o = {}) => {
      if (o.in !== false) tl.fromTo(wrap, { opacity: 0, scale: 1.06, filter: "blur(14px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: o.inDur ?? 0.5, ease: "power3.out" }, 0);

    };
    // floating particles (dust motes / embers)
    const particles = (g, n, seed, box, o = {}) => {
      const r = rng(seed);
      for (let i = 0; i < n; i++) {
        const x = box[0] + r() * box[2], y = box[1] + r() * box[3];
        const c = mk("circle", { cx: x, cy: y, r: (o.rmin ?? 1.5) + r() * ((o.rmax ?? 4) - (o.rmin ?? 1.5)), fill: o.fill ?? "#f4c9a8", opacity: 0 }, g);
        const a = (o.amin ?? 0.15) + r() * ((o.amax ?? 0.6) - (o.amin ?? 0.15));
        const d = o.dur;
        tl.fromTo(c, { opacity: 0, x: 0, y: 0 }, { keyframes: [
            { opacity: a, duration: d * 0.25 }, { opacity: a * (0.4 + r() * 0.6), duration: d * 0.5 }, { opacity: 0, duration: d * 0.25 } ],
          ease: "none" }, 0);
        tl.fromTo(c, { x: 0, y: 0 }, { x: (r() - 0.5) * (o.dx ?? 60), y: -((o.dymin ?? 30) + r() * ((o.dymax ?? 120) - (o.dymin ?? 30))), duration: d, ease: "sine.inOut", immediateRender: false }, 0);
      }
    };

        for (let y = 20; y < len; y += 22) mk("circle", { cx: x, cy: y, r: 6.5, fill: (Math.floor(y / 22) % 4 === 0) ? "#d8862a" : "#e8dcc4", opacity: .55 + r() * .25 }, g);
        mk("path", { d: `M${x - 9} ${len} L${x + 9} ${len} L${x} ${len + 34} Z`, fill: "#c8282f", opacity: .8 }, g);
      }); })();

    (() => { const g = $("#rt-candles"), r = rng(8);
      [[700, 1010, 1], [745, 1022, .85], [860, 1022, .85], [905, 1010, 1], [960, 1030, .75]].forEach(([x, y, s], i) => {
        const c = mk("g", { transform: `translate(${x} ${y}) scale(${s})` }, g);
        mk("circle", { cx: 0, cy: -70, r: 46, fill: "#ffb060", opacity: .22, filter: "url(#rt-blur)", class: "rt-cglow" }, c);
        mk("rect", { x: -9, y: -56, width: 18, height: 56, rx: 3, fill: "#efe2cb" }, c);
        mk("rect", { x: 3, y: -56, width: 6, height: 56, fill: "#b9a68c", opacity: .6 }, c);
        const f = mk("path", { d: "M0 -98 C10 -80 11 -66 0 -58 C-11 -66 -10 -80 0 -98 Z", fill: "url(#rt-flame)" }, c);
        const kf = []; for (let k = 0; k < 24; k++) kf.push({ scaleY: .82 + r() * .36, scaleX: .9 + r() * .2, rotation: (r() - .5) * 10, duration: 1 / 6 });
        tl.fromTo(f, { scaleY: 1, transformOrigin: "50% 100%" }, { keyframes: kf, ease: "sine.inOut" }, 0);
      }); })();
    (() => { const g = $("#rt-petals"), r = rng(15);
      for (let i = 0; i < 60; i++) { const y = 1120 + r() * 760, s = 0.5 + (y - 1100) / 700;
        const x = r() * 1080; mk("ellipse", { cx: x, cy: y, rx: 6 * s, ry: 3 * s, fill: r() > .4 ? "#d8862a" : "#e8dcc4", opacity: .35 + r() * .3, transform: `rotate(${(r() * 180 - 90).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})` }, g); } })();
    tl.fromTo("#rt-circle", { strokeDashoffset: 1600 }, { strokeDashoffset: 0, duration: 1.2, ease: "expo.inOut" }, 0.9);
    tl.fromTo("#rt-circle-glow", { opacity: 0 }, { keyframes: [{ opacity: .7, duration: .15 }, { opacity: .25, duration: .8 }], immediateRender: false }, 1.55);
    particles($("#rt-embers"), 34, 44, [560, 700, 480, 420], { dur: 4, rmin: 1.5, rmax: 3.5, amin: .4, amax: .9, dx: 80, dymin: 160, dymax: 420, fill: "#ffb070" });

    sceneIO("#rt-wrap", 4);
    tl.fromTo("#rt-world", { scale: 1.05 }, { scale: 1.0, duration: 4, ease: "power2.out" }, 0);
    tl.fromTo("#rite-shrine", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
    tl.fromTo("#rt-garlands", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" }, 0.05);
    $$("#rt-smokes path").forEach((p, i) => {
      tl.fromTo(p, { strokeDashoffset: +p.getAttribute("stroke-dasharray") }, { strokeDashoffset: 0, duration: 2.6, ease: "sine.out" }, 0.2 + i * 0.25);

    tl.fromTo("#rt-bull-anim", { rotation: -7, y: 0, transformOrigin: "120px 160px" }, { rotation: 7, duration: 0.08, yoyo: true, repeat: 8, ease: "sine.inOut" }, 0.35);

    tl.fromTo("#rite-bull .eyeglow", { opacity: 0.2, scale: 1, transformOrigin: "50% 50%" }, { opacity: 0.55, scale: 1.4, duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.35);
    tl.fromTo("#rt-world", { x: 0 }, { keyframes: [{ x: -6, duration: .06 }, { x: 6, duration: .06 }, { x: -4, duration: .06 }, { x: 4, duration: .06 }, { x: -3, duration: .06 }, { x: 3, duration: .06 }, { x: 0, duration: .1 }], immediateRender: false }, 0.4);
    tl.fromTo("#rite-glow", { opacity: 0.35 }, { opacity: 1, duration: 0.9, ease: "power2.in" }, 0.3);
    tl.to("#rite-glow", { opacity: 0.6, duration: 0.5, ease: "power2.out" }, 1.25);

    tl.fromTo("#rt-txt", { y: 0 }, { y: -12, duration: 4, ease: "sine.inOut" }, 0);
