    const rng = (s) => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

      { x: -amp, y: amp * 0.4, duration: 0.04 }, { x: amp * 0.85, y: -amp * 0.35, duration: 0.04 },
      { x: -amp * 0.5, y: amp * 0.2, duration: 0.05 }, { x: amp * 0.25, y: 0, duration: 0.05 }, { x: 0, y: 0, duration: 0.07 }

    const particles = (g, n, seed, box, o = {}) => {
      const r = rng(seed);

        const x = box[0] + r() * box[2], y = box[1] + r() * box[3];

        const d = o.dur;
        tl.fromTo(c, { opacity: 0, x: 0, y: 0 }, { keyframes: [
            { opacity: a, duration: d * 0.25 }, { opacity: a * (0.4 + r() * 0.6), duration: d * 0.5 }, { opacity: 0, duration: d * 0.25 } ],

      mk("rect", { x: -260, y: 896, width: 1600, height: 60 }, mid);

        mk("rect", { x: x - 16, y: 962 - h + 8, width: 32, height: h, rx: 12 }, crowd);
      }
      for (let x = -240; x < 1340; x += 70) mk("rect", { x, y: 930, width: 10, height: 70, fill: "#1f120c" }, crowd);
      mk("rect", { x: -260, y: 944, width: 1600, height: 7, fill: "#2a180f" }, crowd);

      // foreground grass tufts (closest layer, blurred)
      const fg = $("#fd-fg"), rf = rng(21);
      for (let x = -260; x < 1360; x += 30 + rf() * 40) {
        const edge = Math.min(Math.abs(x - 540) / 540, 1.4); const h = 50 + rf() * 90 + edge * edge * 160, w = 10 + rf() * 10;
        mk("path", { d: `M${x} 1930 Q${x + w * 0.3} ${1930 - h * 0.6} ${x + w * (rf() > .5 ? 1.6 : -1.2)} ${1930 - h} Q${x + w * 0.6} ${1930 - h * 0.5} ${x + w} 1930 Z` }, fg);
      }
