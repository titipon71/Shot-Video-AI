  <script>
    const tl = gsap.timeline({ paused: true });
    const SVGNS = "http://www.w3.org/2000/svg";
    // deterministic PRNG so every render is identical
    const rng = (s) => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const mk = (tag, attrs, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => Array.from(document.querySelectorAll(s));
    // word-level reveal (whole Thai words, so vowels / tone marks never get separated)
    const rise = (targets, at, o = {}) => tl.fromTo(targets,
      { opacity: 0, y: o.y ?? 44, scale: o.sc ?? 1, filter: "blur(" + (o.b ?? 12) + "px)" },
      { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: o.d ?? 0.75, ease: o.e ?? "expo.out", stagger: o.s ?? 0.1 }, at);
    const wipeMark = (mark, at) => {
      tl.fromTo(mark.querySelector(".mbg"), { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "expo.inOut" }, at);
      rise(mark.querySelectorAll(".wd"), at + 0.2, { y: 26, b: 8, d: 0.6, s: 0.08 });
    };
    const stamp = (mark, at, shakeEl) => {
      tl.fromTo(mark, { opacity: 0, scale: 1.7, filter: "blur(16px)" },
                      { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.in" }, at);
      tl.fromTo(mark, { scale: 1 }, { scale: 1.035, duration: 0.09, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at + 0.2);
      if (shakeEl) shake(shakeEl, at + 0.2, 16);
    };
    const shake = (el, at, amp = 12) => tl.to(el, { keyframes: [
      { x: -amp, y: amp * 0.4, duration: 0.04 }, { x: amp * 0.85, y: -amp * 0.35, duration: 0.04 },
      { x: -amp * 0.5, y: amp * 0.2, duration: 0.05 }, { x: amp * 0.25, y: 0, duration: 0.05 }, { x: 0, y: 0, duration: 0.07 }
    ], ease: "none" }, at);
    // soft scene in/out: no hard cuts between scenes
    const sceneIO = (wrap, dur, o = {}) => {
      if (o.in !== false) tl.fromTo(wrap, { opacity: 0, scale: 1.06, filter: "blur(14px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: o.inDur ?? 0.5, ease: "power3.out" }, 0);
      if (o.out !== false) tl.to(wrap, { opacity: 0, scale: 1.04, filter: "blur(10px)", duration: o.outDur ?? 0.34, ease: "power2.in" }, dur - (o.outDur ?? 0.34));
    };
    // floating particles (dust motes / embers)
    const particles = (g, n, seed, box, o = {}) => {
      const r = rng(seed);
      for (let i = 0; i < n; i++) {
        const x = box[0] + r() * box[2], y = box[1] + r() * box[3];
        const c = mk("circle", { cx: x, cy: y, r: (o.rmin ?? 1.5) + r() * ((o.rmax ?? 4) - (o.rmin ?? 1.5)), fill: o.fill ?? "#f4c9a8", opacity: 0 }, g);
        const a = (o.amin ?? 0.15) + r() * ((o.amax ?? 0.6) - (o.amin ?? 0.15));
        const d = o.dur;
        tl.fromTo(c, { opacity: 0, x: 0, y: 0 }, { keyframes: [
            { opacity: a, duration: d * 0.25 }, { opacity: a * (0.4 + r() * 0.6), duration: d * 0.5 }, { opacity: 0, duration: d * 0.25 } ],
          ease: "none" }, 0);
        tl.fromTo(c, { x: 0, y: 0 }, { x: (r() - 0.5) * (o.dx ?? 60), y: -((o.dymin ?? 30) + r() * ((o.dymax ?? 120) - (o.dymin ?? 30))), duration: d, ease: "sine.inOut", immediateRender: false }, 0);
      }
    };

    particles($("#bd-motes"), 40, 61, [300, 80, 480, 1150], { dur: 5, rmin: 1.2, rmax: 3.2, amin: .2, amax: .6, dx: 60, dymin: 20, dymax: 90, fill: "#fff1dc" });
    sceneIO("#bd-wrap", 5);
    tl.fromTo("#bd-world", { scale: 1.0 }, { scale: 1.07, duration: 5, ease: "sine.inOut" }, 0);
    tl.fromTo("#bd-cone-p", { opacity: 0.4 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.05);
    tl.fromTo("#bd-khwan-anim", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.1);
    tl.to("#bd-khwan-anim", { scaleY: 1.012, transformOrigin: "50% 100%", duration: 1.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.9);
    rise("#b1 .wd", 0.25, { y: 50, sc: 1.15, b: 16, d: 0.9 });
    tl.fromTo("#bd-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "expo.out" }, 0.6);
    // น้ายศ: silhouette steps in from the left, rope lashes out
    tl.fromTo("#bd-p1", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.95);
    tl.fromTo("#bind-draw-a", { strokeDashoffset: 640 }, { strokeDashoffset: 0, duration: 0.65, ease: "expo.inOut" }, 1.15);
    tl.fromTo("#bd-hit-a", { opacity: 0.9, scale: 1, svgOrigin: "434 995" }, { opacity: 0, scale: 4, duration: 0.6, ease: "expo.out", immediateRender: false }, 1.75);
    tl.fromTo("#bd-khwan-anim", { x: 0 }, { keyframes: [{ x: -8, duration: .06 }, { x: 4, duration: .08 }, { x: 0, duration: .14 }], immediateRender: false }, 1.75);
    tl.fromTo("#bd-tick-a", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 1.3);
    rise("#b2 .wd", 1.35, { y: 0, b: 12, d: 0.7 });
    tl.fromTo("#b2 .wd", { x: -120 }, { x: 0, duration: 0.7, ease: "expo.out", immediateRender: false }, 1.35);
    // ยายอ่าง from the right
    tl.fromTo("#bd-p2", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 2.3);
    tl.fromTo("#bind-draw-b", { strokeDashoffset: 640 }, { strokeDashoffset: 0, duration: 0.65, ease: "expo.inOut" }, 2.5);
    tl.fromTo("#bd-hit-b", { opacity: 0.9, scale: 1, svgOrigin: "597 1000" }, { opacity: 0, scale: 4, duration: 0.6, ease: "expo.out", immediateRender: false }, 3.1);
    tl.fromTo("#bd-khwan-anim", { x: 0 }, { keyframes: [{ x: 8, duration: .06 }, { x: -4, duration: .08 }, { x: 0, duration: .14 }], immediateRender: false }, 3.1);
    tl.fromTo("#bd-tick-b", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 2.65);
    rise("#b3 .wd", 2.7, { y: 0, b: 12, d: 0.7 });
    tl.fromTo("#b3 .wd", { x: 120 }, { x: 0, duration: 0.7, ease: "expo.out", immediateRender: false }, 2.7);
    // character acting: blinks, expression changes (neutral -> worried at the first lash -> shocked at the knot)
    const blink = (sel, at) => tl.fromTo(sel, { scaleY: 1 }, { scaleY: 0.12, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false }, at);
    blink("#bdk-eyes", 0.7); blink("#bdk-eyes", 2.45); blink("#bdk-eyes", 4.35);
    const face = (pre, name, at) => { tl.set(`.${pre}-exp`, { opacity: 0 }, at); tl.set(`#${pre}-exp-${name}`, { opacity: 1 }, at); };
    face("bdk", "worried", 1.78); face("bdk", "shocked", 3.32);
    // the knot: rope wraps around Khwan, light turns red
    tl.fromTo("#bind-wrap", { strokeDashoffset: 420 }, { strokeDashoffset: 0, duration: 0.6, ease: "expo.inOut" }, 3.3);
    tl.fromTo(["#bind-rope-a", "#bind-rope-b", "#bind-wrap"], { strokeWidth: 9 }, { strokeWidth: 13, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 3.9);
    tl.to("#bd-redglow", { opacity: 1, duration: 0.6, ease: "power2.out" }, 3.6);
    tl.to("#bd-cone-p", { opacity: 0.55, duration: 0.6, ease: "power2.out" }, 3.6);
    tl.fromTo("#bd-txt", { y: 0 }, { y: -10, duration: 5, ease: "sine.inOut" }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["bind"] = tl;
  </script>
